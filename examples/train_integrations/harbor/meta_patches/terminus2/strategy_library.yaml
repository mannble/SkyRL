strategies:
- pattern: PostgreSQL server must be running before client queries
  steps:
  - Install postgresql-client if not present
  - Install postgresql-server package
  - 'Start service: service postgresql start'
  - 'Verify with: pg_isready -h localhost -p 5432'
  - Then run psql queries
  scope: general
  triggers:
  - postgresql
  - psql
  - database
  - '5432'
  - server
  anti_triggers:
  - server_already_running
- pattern: Custom crontab requires user context switch for verification
  steps:
  - Do NOT use 'crontab -u user -l' with custom script
  - Use 'su - user -c crontab -l' instead
  - Verify output shows crontab entries before proceeding
  scope: general
  triggers:
  - crontab
  - custom
  - verification
  - /usr/local/bin/crontab
  anti_triggers:
  - standard_crontab
  - user_not_custom
- pattern: Verify file existence immediately after creation
  steps:
  - After cat/heredoc creation, run ls -la <filepath>
  - Before using file, verify content with cat or head
  - For scripts, test syntax/import before execution
  scope: core
  triggers:
  - created_file
  - new_file
  - write_file
  - cat
  - heredoc
  - echo
  anti_triggers:
  - already_verified
- pattern: dpkg -l requires package name argument
  steps:
  - Use 'dpkg -l <package_name>' directly
  - 'Pipe to grep only if needed: ''dpkg -l <pkg> | grep pattern'''
  - Do NOT use 'dpkg -l | grep' for filtering all packages
  scope: general
  triggers:
  - dpkg
  - package
  - install
  - version
  - query
  anti_triggers:
  - grep_dpkg_output
- pattern: Log file must have exact line count and format
  steps:
  - 'After creating log, run: wc -l <logfile>'
  - Verify with cat -A for UNIX newlines ($ at end)
  - Ensure TOTAL_FILES or summary line exists
  - Fix missing lines before completing task
  scope: general
  triggers:
  - log
  - compression
  - wc -l
  - total_files
  - lines
  anti_triggers:
  - already_counted
- pattern: tar archive must be created from within target directory
  steps:
  - Copy files to target directory first
  - 'Change into directory: cd <target_dir>'
  - 'Create archive: tar czvf <output>.tar.gz *'
  - 'Verify with: tar -tzvf <output>.tar.gz'
  - Confirm all expected files present
  scope: general
  triggers:
  - tar
  - archive
  - bundle
  - compression
  - tar.gz
  anti_triggers:
  - root_created
- pattern: SSH key verification requires specific commands
  steps:
  - Use 'ls -la' to confirm authorized_keys exists
  - Use 'ssh-keygen -lf' to validate key format
  - Do NOT use 'cmp' for empty/missing files
  - Verify permissions with chmod 600 if needed
  scope: general
  triggers:
  - authorized_keys
  - ssh
  - keygen
  - ed25519
  - public_key
  anti_triggers:
  - cmp
  - xxd_not_available
- pattern: Keep JSON responses clean to prevent parsing errors
  steps:
  - Separate JSON analysis from terminal output
  - Include only analysis/plan/commands fields
  - Use single quotes for JSON strings
  - Keep JSON compact without unnecessary whitespace
  scope: core
  triggers:
  - json
  - thought
  - analysis
  - response
  - parse
  anti_triggers:
  - terminal_output_in_json
- pattern: TSV files require printf with \t escapes
  steps:
  - Use printf 'col1\tcol2\tcol3\n' > file.tsv
  - Or echo -e with proper escaping
  - Verify with cat -A (shows ^I for tabs)
  - Confirm line count with wc -l
  scope: general
  triggers:
  - tsv
  - tab
  - printf
  - echo -e
  - columns
  anti_triggers:
  - heredoc_tabs
- pattern: Final verification before task completion
  steps:
  - List all required files with ls -la
  - Verify each file exists and has content
  - Check file formats with cat -A or od -c
  - Run any specified tests or checks
  - Only mark complete after all verifications pass
  scope: core
  triggers:
  - complete
  - finish
  - done
  - verify
  - check
  anti_triggers:
  - partial_verification
